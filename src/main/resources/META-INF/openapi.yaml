openapi: 3.1.0
info:
  title: Black Hole API
  version: 1.0.0
  description: Bounded API for Black Hole-owned data.
paths:
  /v1/content-registry/{content_hash}:
    put:
      operationId: registerContentHash
      summary: Idempotently register or return a canonical content hash
      description: The registry knows only whether the hash has already been registered. The idempotency key identifies one caller operation and stores no Acquisition semantics, content, or analysis state.
      parameters:
        - name: content_hash
          in: path
          required: true
          description: Lowercase hexadecimal SHA-256 of the final canonical content.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
            minLength: 64
            maxLength: 64
        - name: Idempotency-Key
          in: header
          required: true
          description: Canonical UUID used as an opaque operation key.
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: The hash was registered by this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRegistryResponse'
        '200':
          description: The same operation was replayed with result NEW, or another operation had already registered the hash with result KNOWN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRegistryResponse'
        '400':
          description: The hash or Idempotency-Key is invalid or missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The Idempotency-Key is already associated with another hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The registry database is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ContentRegistryResponse:
      type: object
      required: [content_id, content_hash, result, registered_at]
      additionalProperties: false
      properties:
        content_id:
          type: string
          format: uuid
        content_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          minLength: 64
          maxLength: 64
        result:
          type: string
          enum: [NEW, KNOWN]
        registered_at:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
