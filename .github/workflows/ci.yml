name: Black Hole CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: black-hole-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Kotlin, PostgreSQL and Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run the reproducible CI suite
        run: bash scripts/ci.sh
